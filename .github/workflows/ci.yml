name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check database test runtime
        run: |
          docker info > /dev/null
          docker compose version
      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Run console application
        run: |
          printf '2\n1\nCI book\nCI author\nFiction\n100\n2\n0\n' | timeout 15s java -cp target/classes com.adrian.volumes.Main > /tmp/volumes-smoke.txt
          cat /tmp/volumes-smoke.txt
          grep -Fq 'Your library is empty.' /tmp/volumes-smoke.txt
          grep -Fq 'CI book — CI author | Fiction | 100 pages' /tmp/volumes-smoke.txt
          grep -Fq 'Goodbye!' /tmp/volumes-smoke.txt

      - name: Verify packaged API and database persistence
        run: python3 scripts/smoke_api.py
