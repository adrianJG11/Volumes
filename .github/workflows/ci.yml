name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check database test runtime
        run: |
          docker info > /dev/null
          docker compose version
      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Run console application
        run: |
          printf '2\n1\nCI book\nCI author\nFiction\n100\n2\n0\n' | timeout 15s java -cp target/classes com.adrian.volumes.Main > /tmp/volumes-smoke.txt
          cat /tmp/volumes-smoke.txt
          grep -Fq 'Your library is empty.' /tmp/volumes-smoke.txt
          grep -Fq 'CI book — CI author | Fiction | 100 pages' /tmp/volumes-smoke.txt
          grep -Fq 'Goodbye!' /tmp/volumes-smoke.txt

      - name: Verify packaged API and database persistence
        run: python3 scripts/smoke_api.py

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Install browser test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/volumes-browser"
          "$RUNNER_TEMP/volumes-browser/bin/pip" install -r frontend/tests/requirements.txt
          "$RUNNER_TEMP/volumes-browser/bin/python" -m playwright install --with-deps chromium
      - name: Verify catalog and real session flows in Chromium
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        run: '"$RUNNER_TEMP/volumes-browser/bin/python" frontend/tests/run_browser.py'
