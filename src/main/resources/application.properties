spring.application.name=volumes
# Keep invalid numeric input from being truncated into an integer.
spring.jackson.deserialization.accept-float-as-int=false
# Return structured JSON errors for HTTP parsing and routing errors.
spring.mvc.problemdetails.enabled=true

# Import local Compose settings for development; environment variables can override them.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/volumes
spring.datasource.username=volumes
spring.datasource.password=${POSTGRES_PASSWORD:}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Status names are an API contract; numeric enum ordinals are not accepted.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
